<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulsewise</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="panel">
  <header class="brand">
    <svg class="logo" width="20" height="20" viewBox="0 0 512 512" aria-hidden="true">
      <rect class="logo-ground" x="4" y="4" width="504" height="504" rx="113"/>
      <rect x="128" y="300" width="64" height="112" rx="16" fill="#B4B4BA"/>
      <rect x="224" y="220" width="64" height="192" rx="16" fill="#B4B4BA"/>
      <rect x="320" y="160" width="64" height="252" rx="16" fill="#B4B4BA"/>
      <polyline points="84,290 176,290 206,214 248,372 290,150 322,290 428,290" fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linejoin="round" stroke-linecap="round"/>
      <polyline points="84,290 176,290 206,214 248,372 290,150 322,290 428,290" fill="none" stroke="#0E0E10" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <span class="name">Pulsewise</span>
    <button type="button" class="update" id="update" hidden>
      <svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path d="M8 13V3.5M3.75 7.5 8 3.25l4.25 4.25" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="updateLabel">{{.Update}}</span>
    </button>
  </header>

  <section class="card">
    <div class="metric cpu">
      <div class="head">
        <span class="label">CPU</span>
        <span class="value" id="cpuValue">–</span>
      </div>
      <svg class="spark" width="288" height="28" viewBox="0 0 288 28" aria-hidden="true"><polyline id="cpuSpark"/></svg>
      <div class="chips wrap">
        <span class="chip"><span class="k">{{.CPUUser}}</span> <span id="cpuUser">–</span></span>
        <span class="chip"><span class="k">{{.CPUSys}}</span> <span id="cpuSys">–</span></span>
        <span class="chip"><span class="k">{{.CPUIdle}}</span> <span id="cpuIdle">–</span></span>
      </div>
    </div>

    <div class="metric gpu">
      <div class="head">
        <span class="label">GPU</span>
        <span class="value" id="gpuValue">–</span>
      </div>
      <svg class="spark" width="288" height="28" viewBox="0 0 288 28" aria-hidden="true"><polyline id="gpuSpark"/></svg>
      <div class="chips">
        <span class="chip"><span class="k">{{.GPUModel}}</span> <span id="gpuModel">–</span></span>
        <span class="chip"><span class="k">{{.GPUCores}}</span> <span id="gpuCores">–</span></span>
      </div>
    </div>

    <div class="metric mem">
      <div class="head">
        <span class="label">{{.Memory}}</span>
        <span class="value"><span id="memUsed">–</span> <span class="of">/ <span id="memTotal">–</span> GB</span></span>
      </div>
      <svg class="area" width="288" height="40" viewBox="0 0 288 40" aria-hidden="true">
        <g id="memArea"><path class="compressed" id="memCompArea"/><path class="wired" id="memWiredArea"/><path class="app" id="memAppArea"/></g>
      </svg>
      <div class="chips wrap">
        <span class="chip"><span class="k">{{.MemApp}}</span> <span id="memApp">–</span></span>
        <span class="chip"><span class="k">{{.MemWired}}</span> <span id="memWired">–</span></span>
        <span class="chip"><span class="k">{{.MemComp}}</span> <span id="memComp">–</span></span>
        <span class="chip"><span class="k">{{.MemSwap}}</span> <span id="memSwap">–</span></span>
      </div>
    </div>
    <div class="metric disk">
      <div class="head">
        <span class="label">{{.Disk}} <span class="disk-scope">{{.DiskScope}}</span></span>
        <span class="value" id="diskValue">–</span>
      </div>
      <div class="disk-meter" id="diskMeter" role="progressbar" aria-label="{{.DiskAriaLabel}}" aria-valuemin="0" aria-valuemax="100" aria-valuetext="{{.DiskUnavailable}}">
        <div class="disk-fill" id="diskFill"></div>
      </div>
      <div class="disk-details">
        <span>{{.DiskUsed}} <span id="diskUsed">–</span> / <span id="diskTotal">–</span></span>
        <span>{{.DiskAvailable}} <span id="diskAvailable">–</span></span>
      </div>
    </div>
  </section>

  <footer class="foot">
    <button type="button" class="quit" id="quit">{{.Quit}}</button>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
