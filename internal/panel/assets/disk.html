<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.DiskDetailTitle}}</title>
<link rel="stylesheet" href="app.css">
</head>
<body class="detail-body">
{{template "detail-titlebar.html" .}}
<nav class="detail-nav">
  <a href="memory.html">{{.Memory}}</a>
  <a href="disk.html" aria-current="page">{{.Disk}}</a>
</nav>
<main class="detail detail-disk">
  <header class="detail-head">
    <h1>{{.DiskDetailTitle}}</h1>
    <span class="value detail-total detail-total-disk" id="detailDiskUsage">–</span>
  </header>

  <section class="card detail-summary">
    <div class="disk-meter" id="detailDiskMeter" role="progressbar" aria-label="{{.DiskAriaLabel}}" aria-valuemin="0" aria-valuemax="100" aria-valuetext="{{.DiskUnavailable}}">
      <div class="disk-fill" id="detailDiskFill"></div>
    </div>
    <div class="disk-details">
      <span>{{.DiskUsed}} <span id="detailDiskUsed">–</span> / <span id="detailDiskTotal">–</span></span>
      <span>{{.DiskAvailable}} <span id="detailDiskAvailable">–</span></span>
    </div>
  </section>

  <section class="card detail-section disk-controls">
    <div class="section-head">
      <span class="section-title">{{.DiskScopeLabel}}</span>
      <button type="button" class="btn-secondary" id="chooseDirBtn" hidden>{{.DiskChooseFolder}}</button>
    </div>
    <div class="disk-controls-body">
      <div class="scope-row">
        <input type="text" class="scope-input" id="scanRootInput" aria-label="{{.DiskScopeLabel}}" spellcheck="false" autocomplete="off">
        <button type="button" class="btn-primary" id="startScanBtn">{{.DiskStartScan}}</button>
        <button type="button" class="btn-secondary" id="cancelScanBtn" hidden>{{.DiskCancelScan}}</button>
      </div>
      <div class="scope-presets" id="scopePresets"></div>
    </div>
  </section>

  <section class="card detail-section disk-status" id="scanStatusCard">
    <div class="status-head">
      <span class="status-badge" id="scanStatusBadge"></span>
      <span class="status-text" id="scanStatusText"></span>
    </div>
    <div class="status-meta" id="scanMetaRow" hidden>
      <span id="scanScopeMeta"></span>
      <span id="scanTimeMeta"></span>
      <span id="scanTotalsMeta"></span>
    </div>
    <div class="status-warning" id="scanWarning" hidden>
      <div class="status-warning-text" id="scanWarningText"></div>
      <ul class="skipped-list" id="skippedList" hidden></ul>
    </div>
  </section>

  <section class="card detail-section">
    <div class="section-head">
      <span class="section-title">{{.DiskFilesHeading}}</span>
      <span class="section-meta" id="fileListMeta">–</span>
    </div>
    <div class="reveal-error" id="revealError" role="alert" hidden></div>
    <div class="file-list" id="fileList"></div>
  </section>

  <footer class="mem-notes" id="diskNotes">
    <p>{{.DiskNoteBasis}}</p>
    <p>{{.DiskNoteAPFS}}</p>
    <p>{{.DiskNotePermissions}}</p>
  </footer>
</main>
<script src="disk.js"></script>
</body>
</html>
