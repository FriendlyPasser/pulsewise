<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.MemDetailTitle}}</title>
<link rel="stylesheet" href="app.css">
</head>
<body class="detail-body">
{{template "detail-titlebar.html" .}}
<nav class="detail-nav">
  <a href="memory.html" aria-current="page">{{.Memory}}</a>
  <a href="disk.html">{{.Disk}}</a>
</nav>
<main class="detail">
  <header class="detail-head">
    <h1>{{.MemDetailTitle}}</h1>
    <span class="value detail-total"><span id="detailMemUsed">–</span> <span class="of">/ <span id="detailMemTotal">–</span> GB</span></span>
  </header>

  <section class="card detail-summary">
    <svg class="area" viewBox="0 0 288 40" preserveAspectRatio="none" aria-hidden="true">
      <g id="detailMemArea"><path class="compressed" id="detailMemCompArea"/><path class="wired" id="detailMemWiredArea"/><path class="app" id="detailMemAppArea"/></g>
    </svg>
    <div class="chips wrap">
      <span class="chip"><span class="k">{{.MemApp}}</span> <span id="detailMemApp">–</span></span>
      <span class="chip"><span class="k">{{.MemWired}}</span> <span id="detailMemWired">–</span></span>
      <span class="chip"><span class="k">{{.MemComp}}</span> <span id="detailMemComp">–</span></span>
      <span class="chip"><span class="k">{{.MemSwap}}</span> <span id="detailMemSwap">–</span></span>
    </div>
  </section>

  <section class="card detail-section">
    <div class="section-head">
      <span class="section-title">{{.MemAppsHeading}}</span>
      <span class="section-meta" id="appCount">–</span>
    </div>
    <div class="app-list" id="appList"></div>
  </section>

  <section class="card detail-section" id="unattributedCard" hidden>
    <button type="button" class="app-row unattributed-toggle" id="unattributedToggle" aria-expanded="false">
      <span class="app-main">
        <span class="row-chevron" aria-hidden="true">›</span>
        <span class="app-name">{{.MemUnattributedHeading}}</span>
        <span class="app-procs" id="unattributedCount">0</span>
      </span>
      <span class="app-mem" id="unattributedMem">–</span>
    </button>
    <div class="proc-list" id="unattributedList" hidden></div>
  </section>

  <footer class="mem-notes" id="memNotes">
    <p>{{.MemNoteBasis}}</p>
    <p>{{.MemNoteAttribution}}</p>
    <p>{{.MemNoteUnattributed}}</p>
  </footer>
</main>
<script src="memory.js"></script>
</body>
</html>
